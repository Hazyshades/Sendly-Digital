<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 380" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <radialGradient id="fSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6bd" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#f6b287" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f6b287" stop-opacity="0"/>
    </radialGradient>
    <filter id="fSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <g id="fPine">
      <path d="M0,-26 L7,-12 L3.5,-12 L10,2 L5,2 L12,16 L-12,16 L-5,2 L-10,2 L-3.5,-12 L-7,-12 Z"/>
      <rect x="-1.5" y="16" width="3" height="5"/>
    </g>
  </defs>

  <!-- setting sun glow, centered -->
  <ellipse cx="960" cy="290" rx="520" ry="160" fill="url(#fSun)"/>

  <!-- faint evening stars -->
  <g fill="#ffffff">
    <circle cx="240" cy="60" r="1.4" opacity="0.55"/>
    <circle cx="410" cy="112" r="1" opacity="0.4"/>
    <circle cx="1530" cy="76" r="1.4" opacity="0.5"/>
    <circle cx="1710" cy="128" r="1" opacity="0.35"/>
  </g>

  <!-- far hills -->
  <path fill="#8a6fae" opacity="0.7" d="M0,240 C240,208 480,224 720,204 C960,186 1200,214 1440,198 C1680,184 1800,206 1920,196 L1920,380 L0,380 Z"/>

  <!-- mist -->
  <rect x="0" y="236" width="1920" height="52" fill="#ffffff" opacity="0.1" filter="url(#fSoft)"/>

  <!-- near hills -->
  <path fill="#4d3f79" opacity="0.95" d="M0,300 C220,282 420,296 640,286 C860,276 1080,300 1300,292 C1520,284 1720,300 1920,290 L1920,380 L0,380 Z"/>

  <!-- conifers -->
  <g fill="#2e2853">
    <use href="#fPine" transform="translate(320,292) scale(1.1)"/>
    <use href="#fPine" transform="translate(352,296) scale(0.85)"/>
    <use href="#fPine" transform="translate(1540,290) scale(1.15)"/>
    <use href="#fPine" transform="translate(1576,294) scale(0.9)"/>
  </g>

  <!-- foreground -->
  <path fill="#262148" d="M0,344 C240,336 480,342 720,340 C960,338 1200,344 1440,340 C1680,336 1800,342 1920,340 L1920,380 L0,380 Z"/>

  <!-- paper plane heading home -->
  <path fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="2 8" stroke-linecap="round" d="M472,108 C540,96 616,90 706,88"/>
  <g transform="translate(420,100) rotate(6) scale(0.8)">
    <path d="M0,18 L64,0 L50,22 Z" fill="#fffdf8"/>
    <path d="M0,18 L50,22 L60,34 Z" fill="#dccbf0"/>
  </g>
</svg>
